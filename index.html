<!DOCTYPE html>
<html lang="fil">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Attendance — Class Secretary</title>
<style>
  :root{
    --navy:#16324f; --navy-deep:#0e2438; --gold:#c79a3a;
    --paper:#f6f4ee; --paper-card:#fffdf8;
    --ink:#23282e; --ink-soft:#5c6570; --line:#e2ddcf; --line-strong:#cfc7ae;
    --ok:#3a7d54; --danger:#b8433a; --late:#a3690a; --male:#2f6690;
    --radius:10px;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *,*::before,*::after{ box-sizing:inherit; }
  html{ scroll-padding-top:env(safe-area-inset-top,0px); }
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:"Segoe UI",system-ui,-apple-system,sans-serif; font-size:14px; line-height:1.6;
  }

  /* ---- sign in ---- */
  .auth{
    max-width:380px; margin:7vh auto; background:var(--paper-card);
    border:1px solid var(--line); border-radius:12px; padding:26px 22px;
    box-shadow:0 4px 18px rgba(0,0,0,.05);
  }
  .auth h1{ font-size:18px; margin:0 0 4px; color:var(--navy-deep); }
  .auth p.sub{ margin:0 0 18px; font-size:12.5px; color:var(--ink-soft); }
  label{ display:block; font-size:12px; font-weight:600; color:var(--navy-deep); margin:12px 0 4px; }
  input, select{
    width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:7px;
    font-size:14px; font-family:inherit; background:#fff; color:var(--ink);
  }
  input:focus, select:focus{ outline:2px solid #e7cf95; border-color:var(--gold); }
  .btn{
    width:100%; margin-top:16px; padding:10px 14px; border:0; border-radius:7px;
    background:var(--navy); color:#fff; font-size:14px; font-weight:600;
    font-family:inherit; cursor:pointer;
  }
  .btn:hover{ background:var(--navy-deep); }
  .btn:disabled{ opacity:.6; cursor:default; }
  .linkrow{ margin-top:14px; font-size:12.5px; text-align:center; color:var(--ink-soft); }
  .linkrow a{ color:var(--navy); cursor:pointer; text-decoration:underline; }
  .msg{ margin-top:14px; padding:9px 11px; border-radius:7px; font-size:12.5px; display:none; }
  .msg.err{ display:block; background:#fbeeed; border:1px solid #e2c6c2; color:var(--danger); }
  .msg.ok{ display:block; background:#eaf5ee; border:1px solid #c3e0cd; color:var(--ok); }
  .msg.info{ display:block; background:#eaf1fb; border:1px solid #c7dcf3; color:var(--navy); }

  /* ---- app ---- */
  .top{
    position:sticky; top:0; z-index:20;
    padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;
    background:linear-gradient(160deg,var(--navy-deep),var(--navy)); color:#fff;
    box-shadow:0 2px 10px rgba(0,0,0,.16);
  }
  .top .cls{ font-size:15px; font-weight:600; }
  .top .sub{ font-size:11.5px; opacity:.72; margin-top:2px; }
  .top .who{ font-size:11px; opacity:.6; margin-top:6px; }
  .body{ padding:14px 14px calc(96px + env(safe-area-inset-bottom,0px)); max-width:620px; margin:0 auto; }

  .datebar{
    background:var(--paper-card); border:1px solid var(--line); border-radius:var(--radius);
    padding:12px 14px; margin-bottom:12px;
  }
  .datebar .lab{ font-size:10px; text-transform:uppercase; letter-spacing:.07em; color:var(--navy); font-weight:700; }
  .counts{ display:flex; gap:8px; margin-bottom:12px; }
  .cnt{ flex:1; background:var(--paper-card); border:1px solid var(--line); border-radius:var(--radius); padding:9px 6px; text-align:center; }
  .cnt b{ display:block; font-size:19px; }
  .cnt span{ font-size:9.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); }
  .cnt.p b{ color:var(--ok); } .cnt.a b{ color:var(--danger); } .cnt.l b{ color:var(--late); }

  .grp{ font-size:10.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-soft); font-weight:700; margin:14px 0 6px; }
  .row{
    display:flex; align-items:center; gap:10px; background:var(--paper-card);
    border:1px solid var(--line); border-radius:var(--radius); padding:9px 11px; margin-bottom:6px;
  }
  .row .no{ flex:0 0 22px; font-size:11px; color:var(--ink-soft); }
  .row .nm{ flex:1; font-size:13.5px; font-weight:600; min-width:0; }
  .seg{ display:flex; gap:4px; flex:0 0 auto; }
  .seg button{
    width:34px; height:32px; border:1px solid var(--line); border-radius:7px;
    background:#fff; font-family:inherit; font-size:12px; font-weight:700;
    color:var(--ink-soft); cursor:pointer;
  }
  .seg button.on.p{ background:var(--ok); border-color:var(--ok); color:#fff; }
  .seg button.on.a{ background:var(--danger); border-color:var(--danger); color:#fff; }
  .seg button.on.l{ background:var(--late); border-color:var(--late); color:#fff; }
  .seg button.on.m{ background:var(--male); border-color:var(--male); color:#fff; }

  .savebar{
    position:fixed; left:0; right:0; bottom:0; z-index:30;
    padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));
    background:var(--paper-card); border-top:1px solid var(--line-strong);
    box-shadow:0 -2px 12px rgba(0,0,0,.08);
  }
  .savebar .inner{ max-width:620px; margin:0 auto; display:flex; gap:10px; align-items:center; }
  .savebar .status{ flex:1; font-size:11.5px; color:var(--ink-soft); }
  .savebar button{
    flex:0 0 auto; padding:11px 22px; border:0; border-radius:8px;
    background:var(--gold); color:var(--navy-deep); font-family:inherit;
    font-size:14px; font-weight:700; cursor:pointer;
  }
  .savebar button:disabled{ opacity:.5; cursor:default; }

  .notice{
    background:#f6efdc; border:1px solid #e3d3a4; color:#7a5c12;
    border-radius:var(--radius); padding:10px 12px; font-size:12px; margin-bottom:12px;
  }
  .empty{ text-align:center; padding:34px 14px; color:var(--ink-soft); }
  .empty .em{ font-size:32px; }
  .signout{
    display:block; width:100%; margin-top:18px; padding:10px;
    background:none; border:1px dashed var(--line-strong); border-radius:var(--radius);
    color:var(--ink-soft); font-family:inherit; font-size:12.5px; cursor:pointer;
  }

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#e8e6e1; --ink-soft:#a1a7b0; --line:#39404a; --line-strong:#4a525e;
      --paper-card:#1c2026; --paper:#14171c;
    }
    :root:not([data-theme="light"]) input,
    :root:not([data-theme="light"]) select,
    :root:not([data-theme="light"]) .seg button{ background:#232830; color:var(--ink); }
  }
  :root[data-theme="dark"]{
    --ink:#e8e6e1; --ink-soft:#a1a7b0; --line:#39404a; --line-strong:#4a525e;
    --paper-card:#1c2026; --paper:#14171c;
  }
</style>
</head>
<body>

<div id="authView" class="auth">
  <h1>Attendance — Class Secretary</h1>
  <p class="sub" id="authSub">Mag-sign in gamit ang email na ibinigay sa iyo ng adviser.</p>

  <label for="email">Email</label>
  <input id="email" type="email" autocomplete="email" placeholder="email@example.com">

  <label for="password">Password</label>
  <input id="password" type="password" autocomplete="current-password" placeholder="••••••••">

  <div id="confirmWrap" style="display:none;">
    <label for="password2">Ulitin ang password</label>
    <input id="password2" type="password" autocomplete="new-password" placeholder="••••••••">
  </div>

  <button class="btn" id="btnPrimary">Mag-sign in</button>
  <div class="msg" id="authMsg"></div>

  <div class="linkrow" id="switchRow">Wala pang account? <a id="lnkSwitch">Mag-sign up</a></div>
  <div class="linkrow"><a id="lnkForgot">Nakalimutan ang password?</a></div>
</div>

<div id="appView" hidden>
  <div class="top">
    <div class="cls" id="clsName">—</div>
    <div class="sub" id="clsSub"></div>
    <div class="who" id="who"></div>
  </div>
  <div class="body">
    <div class="datebar">
      <div class="lab">Petsa</div>
      <select id="dateSel"></select>
    </div>
    <div id="dayNotice"></div>
    <div class="counts">
      <div class="cnt p"><b id="cP">0</b><span>Present</span></div>
      <div class="cnt a"><b id="cA">0</b><span>Absent</span></div>
      <div class="cnt l"><b id="cL">0</b><span>Late</span></div>
    </div>
    <div id="list"></div>
    <button class="signout" id="btnSignout">Mag-sign out</button>
  </div>
  <div class="savebar">
    <div class="inner">
      <span class="status" id="saveStatus">Walang pagbabago</span>
      <button id="btnSave" disabled>I-save</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyBA2eEzHdmPYrqikiWPiLorKPLXTIJdhbg",
  authDomain: "sms-v1-e5377.firebaseapp.com",
  projectId: "sms-v1-e5377",
  storageBucket: "sms-v1-e5377.firebasestorage.app",
  messagingSenderId: "437488209294",
  appId: "1:437488209294:web:a0dbce0bd16294b02728df"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

const $ = id => document.getElementById(id);
let mode = 'login';
let classRef = null, classData = null, dirty = false;
let working = {};          // { dateKey: { studentId: mark } }

/* ---------- auth ---------- */
function say(t, k){ const m = $('authMsg'); m.textContent = t; m.className = 'msg ' + (k || 'info'); if(!t) m.className = 'msg'; }
function setMode(next){
  mode = next;
  const su = mode === 'signup';
  $('confirmWrap').style.display = su ? 'block' : 'none';
  $('btnPrimary').textContent = su ? 'Gumawa ng account' : 'Mag-sign in';
  $('authSub').textContent = su
    ? 'Gamitin ang email na ibinigay sa iyo ng adviser. Padadalhan ka ng verification link.'
    : 'Mag-sign in gamit ang email na ibinigay sa iyo ng adviser.';
  $('switchRow').innerHTML = su
    ? 'May account ka na? <a id="lnkSwitch">Mag-sign in</a>'
    : 'Wala pang account? <a id="lnkSwitch">Mag-sign up</a>';
  $('lnkSwitch').addEventListener('click', ()=> setMode(su ? 'login' : 'signup'));
  say('');
}
setMode('login');

function friendly(e){
  const c = (e && e.code) || '';
  if(c === 'auth/invalid-email')        return 'Hindi wasto ang email.';
  if(c === 'auth/user-not-found')       return 'Walang account para rito. Mag-sign up muna.';
  if(c === 'auth/wrong-password' ||
     c === 'auth/invalid-credential')   return 'Mali ang password.';
  if(c === 'auth/email-already-in-use') return 'May account na ito. Mag-sign in na lang.';
  if(c === 'auth/weak-password')        return 'Kailangan ng 6 na karakter pataas.';
  if(c === 'auth/too-many-requests')    return 'Maraming subok. Maghintay muna.';
  if(c === 'auth/network-request-failed') return 'Walang koneksiyon sa internet.';
  return 'May error. Subukang muli.';
}

$('lnkForgot').addEventListener('click', async ()=>{
  const em = $('email').value.trim().toLowerCase();
  if(!em){ say('Ilagay muna ang email sa itaas.', 'err'); return; }
  try{ await auth.sendPasswordResetEmail(em); say('Nagpadala kami ng link sa iyong email.', 'ok'); }
  catch(e){ say(friendly(e), 'err'); }
});

$('btnPrimary').addEventListener('click', async ()=>{
  const em = $('email').value.trim().toLowerCase(), pw = $('password').value;
  if(!em || !pw){ say('Punan ang email at password.', 'err'); return; }
  $('btnPrimary').disabled = true;
  try{
    if(mode === 'signup'){
      if(pw !== $('password2').value){ say('Hindi magkatugma ang password.', 'err'); return; }
      const cred = await auth.createUserWithEmailAndPassword(em, pw);
      await cred.user.sendEmailVerification();
      await auth.signOut();
      setMode('login');
      say('Nagawa na. I-click ang verification link sa email mo, tapos mag-sign in.', 'ok');
    } else {
      await auth.signInWithEmailAndPassword(em, pw);
    }
  }catch(e){ say(friendly(e), 'err'); }
  finally{ $('btnPrimary').disabled = false; }
});

$('btnSignout').addEventListener('click', ()=>{
  if(dirty && !confirm('May hindi pa na-save. Ituloy ang pag-sign out?')) return;
  auth.signOut();
});

auth.onAuthStateChanged(async user=>{
  if(!user){ $('authView').hidden = false; $('appView').hidden = true; return; }
  if(!user.emailVerified){
    await user.reload();
    if(!auth.currentUser.emailVerified){
      $('authView').hidden = false; $('appView').hidden = true;
      say('Hindi pa na-verify ang email mo. I-click muna ang link na ipinadala namin.', 'err');
      try{ await user.sendEmailVerification(); }catch(e){}
      await auth.signOut();
      return;
    }
  }
  await loadClass(user);
});

/* ---------- class ---------- */
async function loadClass(user){
  $('authView').hidden = true; $('appView').hidden = false;
  $('who').textContent = user.email;
  $('clsName').textContent = 'Kinukuha ang klase...';
  try{
    const snap = await db.collection('class_attendance')
      .where('secretaryEmail', '==', user.email.toLowerCase()).limit(1).get();
    if(snap.empty){
      $('clsName').textContent = 'Walang nakatalagang klase';
      $('clsSub').textContent = '';
      $('list').innerHTML = '<div class="empty"><div class="em">&#128274;</div>'
        + '<p>Wala kang nakatalagang klase. Makipag-ugnayan sa iyong adviser.</p></div>';
      return;
    }
    classRef = snap.docs[0].ref;
    classData = snap.docs[0].data();
    working = JSON.parse(JSON.stringify(classData.marks || {}));
    $('clsName').textContent = [classData.gradeLevel && ('Grade ' + classData.gradeLevel), classData.section]
      .filter(Boolean).join(' — ') || 'Klase';
    $('clsSub').textContent = [classData.schoolName, classData.schoolYear].filter(Boolean).join(' · ');
    buildDates();
    render();
  }catch(e){
    console.error(e);
    $('clsName').textContent = 'Hindi makuha ang klase';
    $('list').innerHTML = '<div class="empty"><div class="em">&#9888;</div>'
      + '<p>May problema sa pagkuha ng datos. Subukang i-refresh.</p></div>';
  }
}

const pad = n => String(n).padStart(2,'0');
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;

function buildDates(){
  const back = classData.backdays === undefined ? 3 : classData.backdays;
  const sel = $('dateSel');
  sel.innerHTML = '';
  const today = new Date(); today.setHours(0,0,0,0);
  for(let i = 0; i <= back; i++){
    const d = new Date(today); d.setDate(d.getDate() - i);
    if(d.getDay() === 0 || d.getDay() === 6) continue;      // walang pasok
    const k = keyOf(d);
    const label = d.toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric' })
      + (i === 0 ? ' (ngayon)' : '');
    sel.innerHTML += `<option value="${k}">${label}</option>`;
  }
  if(!sel.options.length){
    sel.innerHTML = '<option value="">Walang araw ng pasok</option>';
  }
}

$('dateSel').addEventListener('change', render);

const MARKS = [['', 'P', 'p'], ['A', 'A', 'a'], ['L', 'L', 'l'], ['M', 'M', 'm']];

function render(){
  const key = $('dateSel').value;
  const roster = classData.roster || [];
  const holidays = classData.holidays || [];
  const list = $('list');

  $('dayNotice').innerHTML = holidays.includes(key)
    ? '<div class="notice">Nakatala ang araw na ito bilang <strong>No Class</strong>. '
      + 'Hindi na kailangang mag-encode.</div>' : '';

  if(!key || roster.length === 0){
    list.innerHTML = '<div class="empty"><div class="em">&#128203;</div><p>Walang listahan.</p></div>';
    return;
  }

  const dayMarks = working[key] || {};
  const groups = [['Male', roster.filter(r=>r.sex === 'MALE')], ['Female', roster.filter(r=>r.sex !== 'MALE')]];
  let html = '', shown = 0;

  groups.forEach(([label, arr])=>{
    const active = arr.filter(r=>{
      // Hindi na ipinapakita ang umalis na bago pa ang petsang ito.
      if(!r.statusDate || r.status === 'ACTIVE' || r.status === 'TRANSFERRED_IN') return true;
      return key < r.statusDate;
    });
    if(!active.length) return;
    html += `<div class="grp">${label} (${active.length})</div>`;
    active.forEach((r, i)=>{
      shown++;
      const cur = dayMarks[r.id] || '';
      const btns = MARKS.map(([val, ch, cls])=>
        `<button data-sid="${r.id}" data-val="${val}" class="${cur === val ? 'on ' + cls : ''}">${ch}</button>`).join('');
      html += `<div class="row"><span class="no">${i+1}</span>
        <span class="nm">${r.name}</span><span class="seg">${btns}</span></div>`;
    });
  });

  list.innerHTML = shown ? html
    : '<div class="empty"><div class="em">&#128203;</div><p>Walang learner sa petsang ito.</p></div>';

  list.querySelectorAll('[data-sid]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const sid = b.dataset.sid, val = b.dataset.val;
      if(!working[key]) working[key] = {};
      if(val === '') delete working[key][sid];
      else working[key][sid] = val;
      dirty = true;
      render();
      updateSave();
    });
  });
  updateCounts(key);
}

function updateCounts(key){
  const roster = classData.roster || [];
  const dm = working[key] || {};
  let a = 0, l = 0;
  roster.forEach(r=>{ const v = dm[r.id]; if(v === 'A') a++; else if(v === 'L') l++; });
  $('cA').textContent = a;
  $('cL').textContent = l;
  $('cP').textContent = Math.max(0, roster.length - a - l);
}

function updateSave(){
  $('btnSave').disabled = !dirty;
  $('saveStatus').textContent = dirty ? 'May hindi pa na-save' : 'Na-save na';
}

$('btnSave').addEventListener('click', async ()=>{
  const btn = $('btnSave');
  btn.disabled = true; $('saveStatus').textContent = 'Sine-save...';
  try{
    const key = $('dateSel').value;
    const count = Object.keys(working[key] || {}).length;
    const log = (classData.log || []).slice(-30);
    log.push({ date: key, by: auth.currentUser.email, count: count, at: Date.now() });
    await classRef.update({
      marks: working,
      log: log,
      updatedAt: Date.now(),
      updatedBy: 'secretary'
    });
    classData.log = log;
    dirty = false;
    updateSave();
    $('saveStatus').textContent = 'Na-save na — nakikita na ito ng adviser.';
  }catch(e){
    console.error(e);
    dirty = true;
    $('saveStatus').textContent = 'Hindi na-save. Subukang muli.';
    btn.disabled = false;
  }
});

window.addEventListener('beforeunload', (e)=>{
  if(dirty){ e.preventDefault(); e.returnValue = ''; }
});
</script>
</body>
</html>
